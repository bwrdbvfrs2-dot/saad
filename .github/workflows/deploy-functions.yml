# Deploys وطني بوت's server (Firebase Cloud Functions) whenever functions/ changes on main, or on demand
# (Actions tab -> "Deploy bot server" -> Run workflow). Needs one repository secret, FIREBASE_SERVICE_ACCOUNT:
# the JSON key of a Google Cloud service account allowed to deploy functions. Without it the job is skipped.
name: Deploy bot server

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "functions/**"
      - "firebase.json"
      - ".github/workflows/deploy-functions.yml"

concurrency:
  group: deploy-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - name: Install
        working-directory: functions
        run: npm ci
      - name: Unit tests
        working-directory: functions
        run: npm test
      - name: Deploy to Firebase
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA_JSON" ]; then
            echo "::warning::FIREBASE_SERVICE_ACCOUNT is not set — skipping the deploy"
            exit 0
          fi
          printf '%s' "$SA_JSON" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx --yes firebase-tools@15.31.0 deploy --only functions --project msar-ac08c --force --non-interactive
          rm -f "$RUNNER_TEMP/sa.json"
